# Logs actual results for sets of one strength piece. Re-logging a set
# overwrites it (the edit path).
mutation CompleteStrengthComponents(
  $strengthWorkoutId: Int!
  $components: [StrengthComponentResultInput!]!
) {
  completeStrengthComponents(strengthWorkoutId: $strengthWorkoutId, components: $components) {
    id
    components {
      id
      completedAt
      completedReps
      completedWeight
      completedRpe
    }
  }
}
