# Every chart on the Activity screen for one week, in one round trip. Each alias
# is the same `stat` query for a different StatType; the result says whether to
# draw it as categories or as a daily series.
query ActivityStats($start: DateTime!, $end: DateTime!, $timezone: String) {
  volume: stat(type: STRENGTH_VOLUME, startDate: $start, endDate: $end, timezone: $timezone) {
    ...StatFields
  }
  intensity: stat(type: INTENSITY_MINUTES, startDate: $start, endDate: $end, timezone: $timezone) {
    ...StatFields
  }
  trainingLoad: stat(type: TRAINING_LOAD, startDate: $start, endDate: $end, timezone: $timezone) {
    ...StatFields
  }
}

fragment StatFields on StatResult {
  __typename
  type
  shape
  unit
  total
  provenance
  ... on CategoricalStat {
    categories {
      label
      value
    }
  }
  ... on SeriesStat {
    series {
      x
      y
    }
  }
}
