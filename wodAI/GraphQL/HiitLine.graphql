# One movement line of a metcon as prescribed for the athlete: what MetconView
# lists and what a swap replaces. A session piece's copy carries only the
# athlete's own numbers (no female column).
fragment HiitLineFields on HIITPrescription {
  line
  partId
  amount
  amountUnit
  max
  load
  loadUnit
  exercise {
    id
    name
    patterns
    loads
  }
}

# Swaps the movement on one line of a session piece. The server converts the
# line for the new movement (unit, load), so read the lines back from the result.
mutation SwapHiitMovement($pieceId: Int!, $line: Int!, $partId: Int, $exerciseId: Int!) {
  swapHiitMovement(pieceId: $pieceId, line: $line, partId: $partId, exerciseId: $exerciseId) {
    id
    displayText
    modified
    prescriptions {
      ...HiitLineFields
    }
  }
}

# Changes the numbers on one line of a session piece, in the units written:
# amount and/or load (clearLoad removes it). Read the lines back from the result.
mutation AdjustHiitLine($pieceId: Int!, $line: Int!, $partId: Int, $amount: Float, $load: Float, $clearLoad: Boolean) {
  adjustHiitLine(pieceId: $pieceId, line: $line, partId: $partId, amount: $amount, load: $load, clearLoad: $clearLoad) {
    id
    displayText
    modified
    prescriptions {
      ...HiitLineFields
    }
  }
}

# Puts a session piece back as it was prescribed, undoing every swap and
# adjustment. Read the lines back from the result.
mutation ResetHiitPiece($pieceId: Int!) {
  resetHiitPiece(pieceId: $pieceId) {
    id
    displayText
    modified
    prescriptions {
      ...HiitLineFields
    }
  }
}

# What each line of a session piece can be swapped for, best first. Each option
# is the line as it would read after that swap (converted for the movement), so
# the app can show it, and apply it, before the swap is saved.
query HiitSwapOptions($pieceId: Int!) {
  hiitSwapOptions(pieceId: $pieceId) {
    line
    partId
    options {
      exercise {
        id
        name
        patterns
      }
      amount
      amountUnit
      max
      load
      loadUnit
    }
  }
}
