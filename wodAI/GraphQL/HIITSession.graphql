# A sensor session recorded while a metcon runs (Core/Sensors/WorkoutSensorRecorder).
# createHIITSession → appendSensorFrames (batched, retry-safe) → completeHIITSession,
# or abandonHIITSession when the run is cancelled.

mutation CreateHIITSession($wodId: ID!, $startedAt: DateTime!, $source: SensorSourceInput) {
  createHIITSession(wodId: $wodId, startedAt: $startedAt, source: $source) {
    id
    maxHeartRateUsed
    zoneThresholds
  }
}

mutation AppendSensorFrames($sessionId: ID!, $frames: [SensorFrameInput!]!) {
  appendSensorFrames(sessionId: $sessionId, frames: $frames)
}

mutation CompleteHIITSession($sessionId: ID!, $endedAt: DateTime!) {
  completeHIITSession(sessionId: $sessionId, endedAt: $endedAt, movementIntervals: []) {
    id
    heartRate {
      ...HeartRateSummaryFields
    }
  }
}

mutation AbandonHIITSession($sessionId: ID!) {
  abandonHIITSession(sessionId: $sessionId)
}

fragment HeartRateSummaryFields on HeartRateSummary {
  avg
  max
  min
  coverage
  zoneSeconds
  trainingLoad
  estimatedCalories
}
