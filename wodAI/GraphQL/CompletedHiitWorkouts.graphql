query CompletedHiitWorkoutsQuery {
  completedHiitWorkouts {
    id
    completedAt
    durationSeconds
    roundsCompleted
    repsCompleted
    perceivedEffort
    notes
    trainingLoad
    heartRate {
      avg
    }
    workout {
      id
      displayText
      stimulus
      constraintType
      constraintMagnitude
    }
  }
}
