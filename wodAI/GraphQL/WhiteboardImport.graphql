# Reads a whiteboard photo into a session on `input.scheduledDate`, streaming it
# like WorkoutGeneration: the header, then each block in order, then the saved
# session. HIIT blocks arrive as drafts (unsaved, so no id) until
# GenerationComplete. Subscribing starts the import; GenerationComplete or
# GenerationFailed is always the last event.
subscription WhiteboardImport($input: WhiteboardImportInput!) {
  whiteboardImport(input: $input) {
    __typename
    ... on GenerationSession {
      name
      description
      stimulus
    }
    ... on GenerationStrengthBlock {
      order
      name
      instructions
    }
    ... on GenerationStrengthSet {
      order
      setOrder
      reps
      weight
      rpe
      exercise {
        name
        muscleGroups
        videoUrl
      }
    }
    ... on GenerationDraftHiitBlock {
      order
      name
      format
      displayText
      stimulus
    }
    ... on GenerationComplete {
      workout {
        ...SessionDetails
      }
    }
    ... on GenerationFailed {
      message
    }
  }
}
